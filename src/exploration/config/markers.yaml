# ArUco landmark map for turtlebot3_house. SINGLE SOURCE OF TRUTH:
# The world, the marker models and the landmark map M are all derived from this
# file. Marker positions are the ground truth your filter is given.
marker:
  dictionary: DICT_4X4_50
  size: 0.12
  plate: 0.16
  thickness: 0.01     # [m]
  texture_px: 512

height: 0.25

sensor:
  refinement: CORNER_REFINE_APRILTAG   # do not use SUBPIX; see above

  # Scaled with the camera resolution: 35 px at 1920 wide -> 23 at 1280 -> 12 at 640.
  # This gate is what bounds max_depth below, so changing resolution WITHOUT
  # changing this silently cuts detection range and breaks route coverage.
  # At 12 px a marker is close to the detector's floor -- if decode rate drops,
  # this is the first thing to suspect, not the materials.
  min_apparent_px: 18
  max_depth: 3.50          # [m] what the px gate actually bounds
  max_range_observed: 4.98

  measured:
    sigma_r: 0.0165        # [m]   after calibration (0.0239 before)
    sigma_phi_deg: 0.243
                           #       30-38 deg bearing -- it degrades toward the edge
    false_positive_rate: 0.00176

  range_scale: 1.02558
  range_offset: -0.00970

  Q:
    sigma_r: 0.02          # [m]   measured 0.0158, rounded up ~25 %
    sigma_phi_deg: 0.5

  motion:
    alpha: [0.30, 0.0, 0.1109, 0.0445]
    R_floor: {sigma_x: 0.01, sigma_y: 0.01, sigma_theta_deg: 0.5}
    step_trans_m: 0.05
    step_rot_deg: 5.0
    innovation_gate: 80.0

  effective_size_for_solvepnp: 0.1215

  error_correction_rate: 0.0

